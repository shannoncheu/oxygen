name: renew
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: renew
      POSTGRES_USER: renew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/deploy.sh first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renew -d renew"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No host port is published. PostgreSQL is accessible only to this stack.

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://renew:${POSTGRES_PASSWORD}@db:5432/renew
      APP_URL: https://${DOMAIN:?Set your domain in .env}
      UPLOAD_DIR: /app/data/uploads
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set your domain in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:
